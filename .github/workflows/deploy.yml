name: Build & Deploy Rich

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rich-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment script syntax
        run: |
          bash -n deploy/remote-deploy.sh
          sh -n scripts/docker-entrypoint.sh

      - name: Set release metadata
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "repository=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check, and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_BUILD_SHA=${{ github.sha }}
            APP_BUILD_TIMESTAMP=${{ steps.image.outputs.timestamp }}
          labels: |
            org.opencontainers.image.title=rich
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: rich-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /srv/apps/rich
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      BUILD_SHA: ${{ github.sha }}
      VERIFY_URL: ${{ vars.VPS_VERIFY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Reject stale deployments and invalid SSH settings
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$remote_sha" == "$BUILD_SHA" ]] || { echo "A newer main commit exists; skipping stale deployment"; exit 1; }
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "Set VPS_HOST to the VPS IPv4 address or hostname"; exit 1; }
          [[ "$VPS_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Set VPS_SSH_USER"; exit 1; }
          if [[ ! "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$VPS_SSH_PORT < 1 || 10#$VPS_SSH_PORT > 65535 )); then
            echo "Invalid VPS_SSH_PORT"
            exit 1
          fi

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install trusted VPS host key
        env:
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KNOWN_HOSTS" || { echo "Set VPS_SSH_KNOWN_HOSTS from a verified VPS host key"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and deploy release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          target="$VPS_SSH_USER@$VPS_HOST"
          release_dir="$APP_DIR/releases/$BUILD_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_options[@]}" -p "$VPS_SSH_PORT" "$target" "umask 077; mkdir -p '$release_dir'"
          scp "${ssh_options[@]}" -P "$VPS_SSH_PORT" \
            deploy/docker-compose.prod.yml deploy/remote-deploy.sh "$target:$release_dir/"
          printf -v remote_command '%q ' env \
            "APP_DIR=$APP_DIR" "IMAGE_REF=$IMAGE_REF" "BUILD_SHA=$BUILD_SHA" \
            "GHCR_USERNAME=$GHCR_USERNAME" "VERIFY_URL=$VERIFY_URL" \
            bash "$release_dir/remote-deploy.sh"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" -p "$VPS_SSH_PORT" "$target" "$remote_command"
